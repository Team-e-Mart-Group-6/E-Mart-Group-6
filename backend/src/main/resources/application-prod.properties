# ------------------------------------------------------------------
# PROD profile - every credential MUST come from an environment
# variable (no hardcoded fallback for the password, unlike dev). SQL
# logging off, app logging trimmed to INFO+.
#
# Activate with: -Dspring.profiles.active=prod
#   (or SPRING_PROFILES_ACTIVE=prod as an env var / Docker ENV)
# ------------------------------------------------------------------

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.root=WARN
logging.level.com.emart=INFO
logging.level.org.hibernate.SQL=WARN
