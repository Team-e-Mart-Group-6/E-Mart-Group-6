# ------------------------------------------------------------------
# DOCKER profile - the app running in a container, talking to MySQL in
# ANOTHER container on the same Docker network.
#
# This file existing is the point: the active profile was set to
# "docker" while no application-docker.properties existed, so Spring
# had no datasource at all and startup died with
#
#   Failed to configure a DataSource: 'url' attribute is not specified
#   and no embedded datasource could be configured
#
# Activate with SPRING_PROFILES_ACTIVE=docker (Docker ENV / compose
# environment / -Dspring.profiles.active=docker).
#
# The default host is "mysql" - a container talking to localhost would
# reach ITSELF, not the database, which is the usual first surprise when
# a working local config is copied into an image. Override DB_HOST (or
# the whole DB_URL) to match whatever the database service is called.
# ------------------------------------------------------------------

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:emart}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:deokar2003}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# A container database usually starts EMPTY, so unlike dev (which points
# at a long-lived local MySQL and is deliberately hands-off) the schema
# is created from the entities here. Override with DDL_AUTO=none once a
# real migration tool owns the schema.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Seed data, tolerated as "already there" on a restart.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# MySQL in a sibling container may still be initialising when this app
# starts, so wait rather than dying on the first connection attempt.
spring.datasource.hikari.initialization-fail-timeout=${DB_INIT_TIMEOUT_MS:60000}
spring.datasource.hikari.connection-timeout=${DB_CONNECT_TIMEOUT_MS:30000}

logging.level.root=INFO
logging.level.com.emart=INFO
logging.level.org.hibernate.SQL=WARN

# Container logs are the log - no rolling file inside an ephemeral
# filesystem nobody will read.
logging.file.name=
