spring.application.name=EmartCategoryMaster
server.port=8080

# Defaults to "dev" so the app behaves exactly as before (local
# MySQL, verbose SQL logging) if you don't pass anything - override
# with -Dspring.profiles.active=prod or the SPRING_PROFILES_ACTIVE
# env var to switch. See application-dev.properties /
# application-prod.properties for what each profile changes.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:docker}

spring.jpa.hibernate.ddl-auto=update

spring.security.oauth2.client.registration.google.client-id=1080883554363-a0dkepf6enn4a9nmcqgkobtqdm3ncek3.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ---- Razorpay (Pay step of checkout) ----
# Test-mode keys by default so the app runs out of the box; override
# with real keys via env vars (or your own application.properties)
# before going live. Get keys from the Razorpay dashboard -> Settings
# -> API Keys.
razorpay.api.key=${RAZORPAY_KEY_ID:rzp_test_TGeHLKQ6M4iovr}
razorpay.api.secret=${RAZORPAY_KEY_SECRET:4nU9Wj2TnsxiiId11hviwZ4S}


# ---- Mail (registration welcome mail, order confirmation mail) ----
# Defaults to SendGrid's SMTP relay (smtp.sendgrid.net:587) for real
# delivery to actual inboxes. MAIL_USERNAME is always the literal
# string "apikey" for SendGrid (not your email/account) - MAIL_PASSWORD
# is the API key generated in SendGrid -> Settings -> API Keys.
# MAIL_FROM must be set separately to the sender address you verify
# in SendGrid -> Settings -> Sender Authentication (EmailServiceImpl
# falls back to MAIL_USERNAME as the from-address otherwise, which
# is wrong for SendGrid since that's "apikey", not an email).
# Swap spring.mail.host/port (via MAIL_HOST/MAIL_PORT) to point this
# at Mailtrap sandbox or another provider instead. Until credentials
# are set, EmailServiceImpl logs and swallows the failure so
# registration/checkout are never blocked by mail delivery.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ---- Loyalty (eMCard points) ----
# BRD: "All cardholder will be given e-points equal to 10% of the
# purchase amount". "Purchase amount" is the cash the customer
# actually pays after eMCard pricing and any point redemption - so a
# fully-redeemed item (0 cash) earns nothing, and an item bought for
# 80 cash + 50 points earns 8. Earned points are rounded DOWN.
#
# Externalised so a promotion (e.g. a double-points weekend) is a
# config change rather than a redeploy. Defaults to the BRD's 10% if
# unset.
# Read by com.emart.service.purchase.LoyaltyPolicy, which is the ONLY
# place that turns cash into points - the cart preview, checkout
# settlement and the invoice label all go through it, so this one value
# cannot be contradicted by a literal somewhere in the code.
emart.loyalty.earn-rate=${LOYALTY_EARN_RATE:0.10}


# ---- Sale Banner bootstrap (demo/dev convenience) ----
# SaleBackfillRunner puts a demo sale on a few products at startup, but
# ONLY when nothing is currently on sale - otherwise the homepage banner
# has nothing to show on a fresh database.
#
# Every number below is configuration on purpose: the discount used to
# be a random percentage picked at boot, which meant the price a
# customer saw was not reproducible. Same properties + same data now
# always produce the same sale prices, and the products are picked in
# id order rather than shuffled.
#
# Turn this OFF in a real deployment and manage sales through the
# product create/update API instead.
emart.sale.bootstrap.enabled=${SALE_BOOTSTRAP_ENABLED:true}
emart.sale.bootstrap.product-count=${SALE_BOOTSTRAP_PRODUCT_COUNT:3}
emart.sale.bootstrap.discount-percent=${SALE_BOOTSTRAP_DISCOUNT_PERCENT:25}
emart.sale.bootstrap.duration-hours=${SALE_BOOTSTRAP_DURATION_HOURS:48}


# ---- One-time price cleanup (OFF by default) ----
# PriceRoundingBackfillRunner rewrites stored mrp/cardholder prices to
# round numbers using a policy hardcoded in that class. That migration
# has already been run, and re-running it silently rewrites real money
# values, so it stays off unless explicitly requested.
emart.bootstrap.price-rounding.enabled=${PRICE_ROUNDING_ENABLED:false}


# ---- Logging (WPT: "Logging") ----
# Shared, profile-agnostic pattern; per-profile files below only
# change the *level*, not the format.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/emart-backend.log
logging.file.max-history=14
